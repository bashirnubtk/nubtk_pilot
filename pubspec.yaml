name: nubtk_pilot
description: "NUBTK PILOT - Northern University Business & Technology Khulna"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.2
  firebase_auth: ^5.7.0
  firebase_storage: ^12.4.2
  firebase_app_check: ^0.3.2+1 # 🔥 এখানে নিয়ে আসছি
  file_picker: ^10.3.10
  pdf: ^3.10.4
  printing: ^5.12.0
  path_provider: ^2.1.2
  cloud_functions: ^5.6.2
  google_generative_ai: ^0.4.7
  mailer: ^6.6.0
  http: ^1.6.0
  url_launcher: ^6.3.1
  font_awesome_flutter: ^10.7.0
  path_provider_android: ^2.3.1
  image_picker: ^1.2.1
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^6.0.5  
  path: ^1.9.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png" 
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/nubtk_pilot.png
  android: true
  ios: true
  android_12:
    image: assets/images/nubtk_pilot.png
    color: "#FFFFFF"