name: nubtk_pilot
description: "NUBTK PILOT - Northern University Business & Technology Khulna"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # আগের প্যাকেজসমূহ
  provider: ^6.0.5
  cupertino_icons: ^1.0.8

  # ফায়ারবেস প্যাকেজসমূহ (ভার্সন কনফ্লিক্ট এড়াতে আপডেট করা হয়েছে)
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.2
  firebase_auth: ^5.7.0
  firebase_storage: ^12.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/